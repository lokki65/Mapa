<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Geocerca Editable y Seguimiento</title>

  <!-- Mapbox -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.10.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.10.0/mapbox-gl.js"></script>

  <!-- Turf.js -->
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
    import { getDatabase, ref, onChildAdded, set, update, push } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBJNp7SynqR5widR2VJDLAAfG56xPcwChA",
      authDomain: "ubicacion.firebaseapp.com",
      databaseURL: "https://ubicacion-5b38e-default-rtdb.firebaseio.com",
      projectId: "ubicacion",
      storageBucket: "ubicacion.appspot.com",
      messagingSenderId: "930942711467",
      appId: "1:930942711467:android:36f427dfa94cc296c369ee"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    const ubicacionRef = ref(database, 'ubicaciones/');
    const geoRef = ref(database, 'geocercas/');

    window.database = database;
    window.ref = ref;
    window.onChildAdded = onChildAdded;
    window.ubicacionRef = ubicacionRef;
    window.set = set;
    window.update = update;
    window.push = push;
    window.geoRef = geoRef;
  </script>

  <style>
    #map { height: 100vh; width: 100%; }
    .botones {
      position: absolute; top: 10px; left: 10px; z-index: 999;
      background: white; padding: 10px; border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .alerta {
      position: absolute; left: 10px;
      padding: 10px; color: white;
      font-weight: bold; font-size: 14px; border-radius: 6px;
      display: none;
    }
    #alerta { top: 80px; background-color: red; }
    #estado { top: 140px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="botones">
    <button onclick="activarDibujo()">📍 Iniciar Geocerca</button>
    <button onclick="finalizarGeocerca()">✅ Finalizar</button>
    <button onclick="eliminarGeocerca()">🗑️ Eliminar Geocerca</button>
    <button onclick="centrarEnUsuario()">🎯 Mi ubicación</button>
  </div>
  <div id="alerta" class="alerta"></div>
  <div id="estado" class="alerta"></div>

  <script>
    mapboxgl.accessToken = 'pk.eyJ1IjoibWljazMzNiIsImEiOiJjbThxYmM4bWQwamJzMnRweXlzaHJkMnZoIn0.tummUvgl6wgWFv5EvydbYw';
    let map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/streets-v11',
      center: [-68.119220, -16.503306],
      zoom: 17
    });

    let puntos = [], dibujando = false;
    let marcador = null, poligono = null, marcadoresVerdes = [];

    function activarDibujo() {
      if (dibujando) return;
      dibujando = true;
      map.once('click', function colocarPunto(e) {
        const punto = [e.lngLat.lng, e.lngLat.lat];
        puntos.push(punto);
        const marcadorVerde = new mapboxgl.Marker({ color: "green" }).setLngLat(punto).addTo(map);
        marcadoresVerdes.push(marcadorVerde);
        map.once('click', colocarPunto);
      });
    }

    function finalizarGeocerca() {
      dibujando = false;
      if (puntos.length < 3) return alert("Debes seleccionar al menos 3 puntos.");
      puntos.push(puntos[0]);
      const geojson = { type: "Feature", geometry: { type: "Polygon", coordinates: [puntos] } };

      if (map.getSource("geocerca")) {
        map.getSource("geocerca").setData(geojson);
      } else {
        map.addSource("geocerca", { type: "geojson", data: geojson });
        map.addLayer({
          id: "geocerca",
          type: "fill",
          source: "geocerca",
          paint: { "fill-color": "#088", "fill-opacity": 0.3 }
        });
      }

      poligono = geojson;
      window.push(window.geoRef, geojson);
    }

    function eliminarGeocerca() {
      if (map.getLayer("geocerca")) map.removeLayer("geocerca");
      if (map.getSource("geocerca")) map.removeSource("geocerca");
      puntos = []; poligono = null;
      marcadoresVerdes.forEach(m => m.remove());
      marcadoresVerdes = [];
      mostrarAlerta("Geocerca eliminada", 'red');
      document.getElementById("estado").style.display = 'none';
    }

    function mostrarAlerta(mensaje, color = 'red') {
      const alerta = document.getElementById("alerta");
      alerta.textContent = mensaje;
      alerta.style.backgroundColor = color;
      alerta.style.display = 'block';
      setTimeout(() => alerta.style.display = 'none', 3000);
    }

    function actualizarEstado(dentro) {
      const estado = document.getElementById("estado");
      estado.textContent = dentro ? "Dentro de la zona" : "¡Fuera de la zona!";
      estado.style.backgroundColor = dentro ? "green" : "red";
      estado.style.display = 'block';
    }

    function centrarEnUsuario() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          const lng = pos.coords.longitude;
          const lat = pos.coords.latitude;
          map.flyTo({ center: [lng, lat], zoom: 18 });
        }, () => alert("No se pudo obtener tu ubicación."));
      } else {
        alert("Geolocalización no soportada por el navegador.");
      }
    }

    window.onload = () => {
      window.onChildAdded(window.ubicacionRef, (snapshot) => {
        const data = snapshot.val();
        if (!data || !data.latitud || !data.longitud) return;

        const lat = parseFloat(data.latitud);
        const lng = parseFloat(data.longitud);
        const coords = [lng, lat];

        if (!marcador || marcador.getLngLat().lng !== lng || marcador.getLngLat().lat !== lat) {
          if (marcador) marcador.remove();
          marcador = new mapboxgl.Marker({ color: 'blue' }).setLngLat(coords).addTo(map);
          map.flyTo({ center: coords });
        }

        let dentro = false;
        if (poligono) {
          dentro = turf.booleanPointInPolygon(turf.point(coords), poligono);
        }

        actualizarEstado(dentro);
        if (!dentro && poligono) mostrarAlerta("¡Fuera de la zona segura!");

        const horaActual = new Date().toLocaleTimeString("es-BO", { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        window.update(snapshot.ref, {
          seguridad: dentro ? 1 : 0,
          hora: horaActual
        });
      });
    };
  </script>
</body>
</html>
